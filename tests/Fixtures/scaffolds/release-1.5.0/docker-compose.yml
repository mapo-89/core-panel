services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-prod
      args:
        APP_ENV: production
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-de_DE}
      APP_NAME: ${APP_NAME:-CorePanel}
      APP_URL: ${APP_URL:-http://localhost}
      ASSET_URL:
      CACHE_STORE: ${CACHE_STORE:-redis}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_DATABASE: ${DB_DATABASE:-core_panel}
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-core_panel}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-core_panel}
      DATABASE_BACKUPS_PATH: ${DATABASE_BACKUPS_PATH:-/var/www/html/storage/app/backups/database}
      HORIZON_SLACK_CHANNEL: ${HORIZON_SLACK_CHANNEL:-}
      HORIZON_SLACK_WEBHOOK_URL: ${HORIZON_SLACK_WEBHOOK_URL:-}
      MAIL_LOCAL_RECIPIENT: ${MAIL_LOCAL_RECIPIENT:-}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-1025}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_PATH: ${SESSION_PATH:-/}
      SYSTEM_UPDATES_UPDATER_URL: ${SYSTEM_UPDATES_UPDATER_URL:-http://system-updater:8080}
      SYSTEM_UPDATES_TOKEN: ${SYSTEM_UPDATES_TOKEN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "9000"

  app-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-dev
      args:
        APP_ENV: testing
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: testing
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-de_DE}
      APP_NAME: ${APP_NAME:-CorePanel}
      APP_URL: http://app-test
      ASSET_URL:
      CACHE_STORE: ${CACHE_STORE:-redis}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_DATABASE: ${DB_DATABASE_TEST:-core_panel_test}
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-core_panel}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-core_panel}
      DATABASE_BACKUPS_PATH: ${DATABASE_BACKUPS_PATH:-/var/www/html/storage/app/backups/database}
      HORIZON_SLACK_CHANNEL: ${HORIZON_SLACK_CHANNEL:-}
      HORIZON_SLACK_WEBHOOK_URL: ${HORIZON_SLACK_WEBHOOK_URL:-}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_PATH: ${SESSION_PATH:-/}
      SYSTEM_UPDATES_UPDATER_URL: ${SYSTEM_UPDATES_UPDATER_URL:-http://system-updater:8080}
      SYSTEM_UPDATES_TOKEN: ${SYSTEM_UPDATES_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sleep", "infinity"]

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-prod
      args:
        APP_ENV: production
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-de_DE}
      APP_NAME: ${APP_NAME:-CorePanel}
      APP_URL: ${APP_URL:-http://localhost}
      ASSET_URL:
      CACHE_STORE: ${CACHE_STORE:-redis}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_DATABASE: ${DB_DATABASE:-core_panel}
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-core_panel}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-core_panel}
      DATABASE_BACKUPS_PATH: ${DATABASE_BACKUPS_PATH:-/var/www/html/storage/app/backups/database}
      HORIZON_SLACK_CHANNEL: ${HORIZON_SLACK_CHANNEL:-}
      HORIZON_SLACK_WEBHOOK_URL: ${HORIZON_SLACK_WEBHOOK_URL:-}
      MAIL_LOCAL_RECIPIENT: ${MAIL_LOCAL_RECIPIENT:-}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_PATH: ${SESSION_PATH:-/}
      SYSTEM_UPDATES_UPDATER_URL: ${SYSTEM_UPDATES_UPDATER_URL:-http://system-updater:8080}
      SYSTEM_UPDATES_TOKEN: ${SYSTEM_UPDATES_TOKEN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "horizon"]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-prod
      args:
        APP_ENV: production
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-de_DE}
      APP_NAME: ${APP_NAME:-CorePanel}
      APP_URL: ${APP_URL:-http://localhost}
      ASSET_URL:
      CACHE_STORE: ${CACHE_STORE:-redis}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_DATABASE: ${DB_DATABASE:-core_panel}
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-core_panel}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-core_panel}
      DATABASE_BACKUPS_PATH: ${DATABASE_BACKUPS_PATH:-/var/www/html/storage/app/backups/database}
      HORIZON_SLACK_CHANNEL: ${HORIZON_SLACK_CHANNEL:-}
      HORIZON_SLACK_WEBHOOK_URL: ${HORIZON_SLACK_WEBHOOK_URL:-}
      MAIL_LOCAL_RECIPIENT: ${MAIL_LOCAL_RECIPIENT:-}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_PATH: ${SESSION_PATH:-/}
      SYSTEM_UPDATES_UPDATER_URL: ${SYSTEM_UPDATES_UPDATER_URL:-http://system-updater:8080}
      SYSTEM_UPDATES_TOKEN: ${SYSTEM_UPDATES_TOKEN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-${DB_DATABASE:-core_panel}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-core_panel}}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USERNAME:-core_panel}}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-${DB_USERNAME:-core_panel}} -d ${POSTGRES_DB:-${DB_DATABASE:-core_panel}}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"

volumes:
  postgres-data:
  redis-data:
