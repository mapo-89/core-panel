services:
  app:
    extends:
      file: docker-compose.yml
      service: app
    build:
      target: php-dev
      args:
        APP_ENV: local
    environment:
      APP_ENV: local
      APP_DEBUG: ${DEV_APP_DEBUG:-true}
      APP_URL: ${DEV_APP_URL:-http://localhost:8000}
      ASSET_URL: ${DEV_ASSET_URL:-http://localhost:8000}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      SYSTEM_UPDATES_FORCE_UPDATE_ENABLED: ${SYSTEM_UPDATES_FORCE_UPDATE_ENABLED:-true}
      SYSTEM_UPDATES_TOKEN: ${SYSTEM_UPDATES_TOKEN:-local-dev-token}
      SYSTEM_UPDATES_UPDATER_URL: ${SYSTEM_UPDATES_UPDATER_URL:-http://system-updater:8080}
    volumes:
      - ./:/var/www/html
    command: ["/bin/sh", "/var/www/html/.docker/bin/start-dev-app.sh"]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
    environment:
      PHP_UPSTREAM: ${PHP_UPSTREAM:-app:9000}
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./.docker/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro

  app-test:
    extends:
      file: docker-compose.yml
      service: app-test
    build:
      target: php-dev
    volumes:
      - ./:/var/www/html

  horizon:
    extends:
      file: docker-compose.yml
      service: horizon
    build:
      target: php-dev
      args:
        APP_ENV: local
    environment:
      APP_ENV: local
      APP_URL: ${DEV_APP_URL:-http://localhost:8000}
      ASSET_URL: ${DEV_ASSET_URL:-http://localhost:8000}
    volumes:
      - ./:/var/www/html
    command: ["/bin/sh", "/var/www/html/.docker/bin/start-dev-artisan.sh", "horizon"]

  scheduler:
    extends:
      file: docker-compose.yml
      service: scheduler
    build:
      target: php-dev
      args:
        APP_ENV: local
    environment:
      APP_ENV: local
      APP_URL: ${DEV_APP_URL:-http://localhost:8000}
      ASSET_URL: ${DEV_ASSET_URL:-http://localhost:8000}
    volumes:
      - ./:/var/www/html
    command: ["/bin/sh", "/var/www/html/.docker/bin/start-dev-artisan.sh", "schedule:work"]

  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  mailpit:
    extends:
      file: docker-compose.yml
      service: mailpit

  system-updater:
    build:
      context: ./updater
      dockerfile: Dockerfile
    environment:
      UPDATER_ADDR: :8080
      UPDATER_COMPOSE_FILES: ${SYSTEM_UPDATER_COMPOSE_FILES:-auto}
      UPDATER_COMPOSE_PROJECT_NAME: ${SYSTEM_UPDATER_COMPOSE_PROJECT_NAME:-auto}
      UPDATER_COMPOSE_WORKDIR: ${SYSTEM_UPDATER_COMPOSE_WORKDIR:-auto}
      UPDATER_FORCE_SELF_UPDATE_AVAILABLE: ${SYSTEM_UPDATER_FORCE_SELF_UPDATE_AVAILABLE:-false}
      UPDATER_RUNTIME_SERVICES: ${SYSTEM_UPDATER_RUNTIME_SERVICES:-app,horizon,scheduler,nginx}
      UPDATER_SELF_SERVICE: ${SYSTEM_UPDATER_SELF_SERVICE:-system-updater}
      UPDATER_SELF_UPDATE_ENABLED: ${SYSTEM_UPDATER_SELF_UPDATE_ENABLED:-false}
      UPDATER_STATE_PATH: /data/state.json
      UPDATER_TOKEN: ${SYSTEM_UPDATES_TOKEN:-local-dev-token}
    ports:
      - "${SYSTEM_UPDATER_PORT:-8080}:8080"
    volumes:
      - ./:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - system-updater-data:/data

volumes:
  postgres-data:
  redis-data:
  system-updater-data:
