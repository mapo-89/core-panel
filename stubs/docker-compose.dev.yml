services:
  app:
    extends:
      file: docker-compose.yml
      service: app
    build:
      target: php-base
    environment:
      - DB_HOST=postgres
    ports:
      - "${APP_PORT:-8000}:8000"
      - "${OCTANE_ADMIN_PORT:-2019}:2019"
    volumes:
      - ./:/var/www/html
    command: >
      sh -lc "if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi &&
      until pg_isready -h \"$${DB_HOST}\" -p \"$${DB_PORT}\" -U \"$${DB_USERNAME}\" -d postgres; do sleep 2; done &&
      psql \"host=$${DB_HOST} port=$${DB_PORT} user=$${DB_USERNAME} password=$${DB_PASSWORD} dbname=postgres\" -tc \"SELECT 1 FROM pg_database WHERE datname = '$${DB_DATABASE}'\" | grep -q 1 || psql \"host=$${DB_HOST} port=$${DB_PORT} user=$${DB_USERNAME} password=$${DB_PASSWORD} dbname=postgres\" -c \"CREATE DATABASE \\\"$${DB_DATABASE}\\\"\" &&
      psql \"host=$${DB_HOST} port=$${DB_PORT} user=$${DB_USERNAME} password=$${DB_PASSWORD} dbname=postgres\" -tc \"SELECT 1 FROM pg_database WHERE datname = '$${DB_DATABASE_TEST:-core_panel_test}'\" | grep -q 1 || psql \"host=$${DB_HOST} port=$${DB_PORT} user=$${DB_USERNAME} password=$${DB_PASSWORD} dbname=postgres\" -c \"CREATE DATABASE \\\"$${DB_DATABASE_TEST:-core_panel_test}\\\"\" &&
      php artisan optimize:clear &&
      php artisan serve --host=0.0.0.0 --port=8000"

  app-test:
    extends:
      file: docker-compose.yml
      service: app-test
    build:
      target: php-base
    volumes:
      - ./:/var/www/html
    command: >
      sh -lc "if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi &&
      until pg_isready -h \"$${DB_HOST}\" -p \"$${DB_PORT}\" -U \"$${DB_USERNAME}\" -d postgres; do sleep 2; done &&
      psql \"host=$${DB_HOST} port=$${DB_PORT} user=$${DB_USERNAME} password=$${DB_PASSWORD} dbname=postgres\" -tc \"SELECT 1 FROM pg_database WHERE datname = '$${DB_DATABASE_TEST:-core_panel_test}'\" | grep -q 1 || psql \"host=$${DB_HOST} port=$${DB_PORT} user=$${DB_USERNAME} password=$${DB_PASSWORD} dbname=postgres\" -c \"CREATE DATABASE \\\"$${DB_DATABASE_TEST:-core_panel_test}\\\"\" &&
      php artisan optimize:clear &&
      sleep infinity"

  horizon:
    extends:
      file: docker-compose.yml
      service: horizon
    build:
      target: php-base
    volumes:
      - ./:/var/www/html
    command: >
      sh -lc "if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi &&
      until pg_isready -h \"$${DB_HOST}\" -p \"$${DB_PORT}\" -U \"$${DB_USERNAME}\" -d postgres; do sleep 2; done &&
      php artisan optimize:clear &&
      php artisan horizon"

  scheduler:
    extends:
      file: docker-compose.yml
      service: scheduler
    build:
      target: php-base
    volumes:
      - ./:/var/www/html
    command: >
      sh -lc "if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi &&
      until pg_isready -h \"$${DB_HOST}\" -p \"$${DB_PORT}\" -U \"$${DB_USERNAME}\" -d postgres; do sleep 2; done &&
      php artisan optimize:clear &&
      php artisan schedule:work"

  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  mailpit:
    extends:
      file: docker-compose.yml
      service: mailpit

volumes:
  postgres-data:
  redis-data:
