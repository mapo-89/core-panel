x-development-build-args: &development-build-args
  USER_ID: ${DEV_USER_ID:-1000}
  GROUP_ID: ${DEV_GROUP_ID:-1000}

services:
  app:
    extends:
      file: docker-compose.yml
      service: app
    user: root
    pull_policy: never
    build:
      target: app-dev
      args:
        <<: *development-build-args
        APP_ENV: local
    environment:
      APP_ENV: local
      APP_DEBUG: ${DEV_APP_DEBUG:-true}
      APP_URL: ${DEV_APP_URL:-http://localhost:8000}
      ASSET_URL: ${DEV_ASSET_URL:-http://localhost:8000}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      PREPARE_LOCAL_ENVIRONMENT: "true"
      PHP_OPCACHE_ENABLE: "0"
      SYSTEM_UPDATES_FORCE_UPDATE_ENABLED: ${SYSTEM_UPDATES_FORCE_UPDATE_ENABLED:-true}
      SYSTEM_UPDATES_TOKEN: ${SYSTEM_UPDATES_TOKEN:-local-dev-token}
      SYSTEM_UPDATES_UPDATER_URL: ${SYSTEM_UPDATES_UPDATER_URL:-http://system-updater:8080}
    volumes:
      - ./:/var/www/html
    ports:
      - "${APP_PORT:-8000}:8080"

  app-test:
    extends:
      file: docker-compose.yml
      service: app-test
    build:
      target: app-dev
      args:
        <<: *development-build-args
        APP_ENV: testing
    volumes:
      - ./:/var/www/html

  horizon:
    extends:
      file: docker-compose.yml
      service: horizon
    pull_policy: never
    build:
      target: app-dev
      args:
        <<: *development-build-args
        APP_ENV: local
    environment:
      APP_ENV: local
      APP_URL: ${DEV_APP_URL:-http://localhost:8000}
      ASSET_URL: ${DEV_ASSET_URL:-http://localhost:8000}
    volumes:
      - ./:/var/www/html
    command: ["/bin/sh", "/var/www/html/.docker/bin/start-dev-artisan.sh", "horizon"]

  scheduler:
    extends:
      file: docker-compose.yml
      service: scheduler
    pull_policy: never
    build:
      target: app-dev
      args:
        <<: *development-build-args
        APP_ENV: local
    environment:
      APP_ENV: local
      APP_URL: ${DEV_APP_URL:-http://localhost:8000}
      ASSET_URL: ${DEV_ASSET_URL:-http://localhost:8000}
    volumes:
      - ./:/var/www/html
    command: ["/bin/sh", "/var/www/html/.docker/bin/start-dev-artisan.sh", "schedule:work"]

  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  mailpit:
    extends:
      file: docker-compose.yml
      service: mailpit

  system-updater:
    build:
      context: ./updater
      dockerfile: Dockerfile
    pull_policy: never
    environment:
      UPDATER_ADDR: :8080
      UPDATER_COMPOSE_FILES: docker-compose.yml,docker-compose.dev.yml
      UPDATER_COMPOSE_PROJECT_NAME: ${SYSTEM_UPDATER_COMPOSE_PROJECT_NAME:-auto}
      UPDATER_COMPOSE_WORKDIR: /workspace
      UPDATER_FORCE_SELF_UPDATE_AVAILABLE: ${SYSTEM_UPDATER_FORCE_SELF_UPDATE_AVAILABLE:-false}
      UPDATER_RUNTIME_SERVICES: ${SYSTEM_UPDATER_RUNTIME_SERVICES:-app,horizon,scheduler}
      UPDATER_SELF_SERVICE: ${SYSTEM_UPDATER_SELF_SERVICE:-system-updater}
      UPDATER_SELF_UPDATE_ENABLED: ${SYSTEM_UPDATER_SELF_UPDATE_ENABLED:-false}
      UPDATER_STATE_PATH: /data/state.json
      UPDATER_TOKEN: ${SYSTEM_UPDATES_TOKEN:-local-dev-token}
    ports:
      - "${SYSTEM_UPDATER_PORT:-8080}:8080"
    volumes:
      - ./:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - system-updater-data:/data

volumes:
  postgres-data:
  redis-data:
  system-updater-data:
