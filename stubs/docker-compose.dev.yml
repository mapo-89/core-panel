services:
  app:
    extends:
      file: docker-compose.yml
      service: app
    build:
      target: php-dev
      args:
        APP_ENV: local
    environment:
      APP_ENV: local
      APP_URL: ${APP_URL:-http://localhost:8000}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
    volumes:
      - ./:/var/www/html
    command: ["/bin/sh", "/var/www/html/.docker/bin/start-dev-app.sh"]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  app-test:
    extends:
      file: docker-compose.yml
      service: app-test
    build:
      target: php-dev
    volumes:
      - ./:/var/www/html

  horizon:
    extends:
      file: docker-compose.yml
      service: horizon
    build:
      target: php-dev
      args:
        APP_ENV: local
    environment:
      APP_ENV: local
    volumes:
      - ./:/var/www/html
    command: ["/bin/sh", "/var/www/html/.docker/bin/start-dev-artisan.sh", "horizon"]

  scheduler:
    extends:
      file: docker-compose.yml
      service: scheduler
    build:
      target: php-dev
      args:
        APP_ENV: local
    environment:
      APP_ENV: local
    volumes:
      - ./:/var/www/html
    command: ["/bin/sh", "/var/www/html/.docker/bin/start-dev-artisan.sh", "schedule:work"]

  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  mailpit:
    extends:
      file: docker-compose.yml
      service: mailpit

volumes:
  postgres-data:
  redis-data:
