services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: local
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_DATABASE: ${DB_DATABASE:-core_panel}
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-core_panel}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-core_panel}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      OCTANE_SERVER: frankenphp
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  app-test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: testing
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: testing
      APP_URL: http://app-test
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_DATABASE: ${DB_DATABASE_TEST:-core_panel_test}
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-core_panel}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-core_panel}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: local
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: local
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_DATABASE: ${DB_DATABASE:-core_panel}
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-core_panel}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-core_panel}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: local
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: local
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_DATABASE: ${DB_DATABASE:-core_panel}
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-core_panel}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-core_panel}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-core_panel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-core_panel}
      POSTGRES_USER: ${POSTGRES_USER:-core_panel}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-core_panel} -d ${POSTGRES_DB:-core_panel}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"

volumes:
  postgres-data:
  redis-data:
