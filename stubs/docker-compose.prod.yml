services:
  app:
    extends:
      file: docker-compose.yml
      service: app
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "2019:2019"
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/octane.conf"]

  app-test:
    extends:
      file: docker-compose.yml
      service: app-test
    profiles:
      - test
    command: ["sleep", "infinity"]

  horizon:
    extends:
      file: docker-compose.yml
      service: horizon
    restart: unless-stopped
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/horizon.conf"]

  scheduler:
    extends:
      file: docker-compose.yml
      service: scheduler
    restart: unless-stopped
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/scheduler.conf"]

  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    restart: unless-stopped

  redis:
    extends:
      file: docker-compose.yml
      service: redis
    restart: unless-stopped

  mailpit:
    extends:
      file: docker-compose.yml
      service: mailpit
    profiles:
      - tooling

  nginx:
    image: nginx:1.27-alpine
    profiles:
      - nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    command: >
      /bin/sh -lc "cat <<'EOF' >/etc/nginx/conf.d/default.conf
      server {
          listen 80;
          client_max_body_size 64m;
          location / {
              proxy_pass http://app:8000;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }
      }
      EOF
      && nginx -g 'daemon off;'"

volumes:
  postgres-data:
  redis-data:
