services:
  app:
    extends:
      file: docker-compose.yml
      service: app
    environment:
      APP_ENV: production
    volumes:
      - ${PUBLIC_STORAGE_PATH:-/srv/docker/core-panel/storage/public}:/var/www/html/storage/app/public
    restart: unless-stopped

  horizon:
    extends:
      file: docker-compose.yml
      service: horizon
    volumes:
      - ${PUBLIC_STORAGE_PATH:-/srv/docker/core-panel/storage/public}:/var/www/html/storage/app/public
    restart: unless-stopped

  scheduler:
    extends:
      file: docker-compose.yml
      service: scheduler
    volumes:
      - ${PUBLIC_STORAGE_PATH:-/srv/docker/core-panel/storage/public}:/var/www/html/storage/app/public
    restart: unless-stopped

  migrate:
    extends:
      file: docker-compose.yml
      service: app
    command: ["php", "artisan", "migrate", "--force"]
    environment:
      APP_ENV: production
    profiles: ["migrate"]
    volumes:
      - ${PUBLIC_STORAGE_PATH:-/srv/docker/core-panel/storage/public}:/var/www/html/storage/app/public
    restart: "no"

  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    restart: unless-stopped
    ports: !reset []
    volumes:
      - ${POSTGRES_DATA_PATH:-/srv/docker/core-panel/postgres}:/var/lib/postgresql

  redis:
    extends:
      file: docker-compose.yml
      service: redis
    restart: unless-stopped
    ports: !reset []
    volumes:
      - ${REDIS_DATA_PATH:-/srv/docker/core-panel/redis/data}:/data

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-runtime
    depends_on:
      app:
        condition: service_started
    volumes:
      - ${PUBLIC_STORAGE_PATH:-/srv/docker/core-panel/storage/public}:/var/www/html/storage/app/public:ro
    restart: unless-stopped
    ports:
      - "8000:80"
